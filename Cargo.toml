[package]
name = "zerofactor"
version = "0.1.0"
edition = "2021"
description = "Read-only repository intelligence and security evidence engine"
license = "UNLICENSED"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "zerofactor"
path = "src/main.rs"

[lib]
name = "zerofactor"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
