name: gVisor host validation (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zerofactor-gvisor-host-validation
  cancel-in-progress: false

jobs:
  gvisor-host-smoke:
    # Self-hosted Docker access is host-root-equivalent. Use a disposable one-job VM.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, gvisor]
    environment: gvisor-lab-approval
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Capture host and runtime metadata
        env:
          ZEROFACTOR_TEST_IMAGE: ${{ vars.ZEROFACTOR_TEST_IMAGE }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            uname -a
            docker version
            docker info
            runsc --version
            test -n "$ZEROFACTOR_TEST_IMAGE"
            docker image inspect "$ZEROFACTOR_TEST_IMAGE" --format 'image_id={{.Id}} repo_digests={{json .RepoDigests}}'
          } > evidence/host-metadata.txt 2>&1

      - name: Verify gVisor isolation controls
        env:
          ZEROFACTOR_TEST_IMAGE: ${{ vars.ZEROFACTOR_TEST_IMAGE }}
        run: |
          set -euo pipefail
          bash sandbox/verify-host.sh 2>&1 | tee evidence/verify-host.log

      - name: Hash evidence files
        if: always()
        run: |
          mkdir -p evidence
          if find evidence -maxdepth 1 -type f ! -name SHA256SUMS -print -quit | grep -q .; then
            (cd evidence && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)) > evidence/SHA256SUMS
          fi

      - name: Upload host validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gvisor-host-validation-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
