name: Security and SBOM
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Generate Cargo lockfile for this Rust application
        run: cargo generate-lockfile
      - name: Native lockfile inventory and graph
        run: python3 scripts/dependency_graph.py . --output dependency-graph.json
      - name: Install prebuilt cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: RustSec advisory audit
        run: cargo audit --deny warnings
      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.2.2
      - name: Scan supported lockfiles against OSV
        shell: bash
        run: |
          set +e
          "$(go env GOPATH)/bin/osv-scanner" scan source -r . --format json --all-packages > osv-results.json
          status=$?
          set -e
          echo "$status" > osv-scanner.exit-code
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Normalize exact-version advisory matches
        if: always() && hashFiles('osv-results.json') != ''
        run: python3 scripts/normalize_osv.py osv-results.json --output advisory-results.json
      - name: Enforce CVE policy when trusted source metadata is supplied
        if: always() && hashFiles('source-metadata.json') != ''
        run: python3 scripts/cve_policy.py advisory-results.json --source-metadata source-metadata.json --output cve-policy-result.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Upload dependency, advisory and SBOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerofactor-supply-chain-evidence
          path: |
            dependency-graph.json
            osv-results.json
            osv-scanner.exit-code
            advisory-results.json
            cve-policy-result.json
            sbom.spdx.json
            sbom.cdx.json
          if-no-files-found: warn
  sandbox-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n sandbox/run-isolated.sh sandbox/verify-host.sh
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: test -s dashboard/index.html && test -s dashboard/app.js
